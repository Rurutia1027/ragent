name: ragent-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragent-demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragent
    ports:
      - "5432:5432"
    volumes:
      - ragent-pg-data:/var/lib/postgresql/data
      - ../../../resources/database/schema_pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../../resources/database/init_data_pg.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ragent" ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: ragent-demo-redis
    command: redis-server --requirepass 123456
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "123456", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.72
    container_name: ragent-demo-rustfs
    command:
      - "--address"
      - ":9000"
      - "--console-enable"
      - "--access-key"
      - "rustfsadmin"
      - "--secret-key"
      - "rustfsadmin"
      - "/data"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ragent-rustfs-data:/data
    healthcheck:
      test: [ "CMD", "sh", "-c", "wget -qO- http://localhost:9000/ || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  rmqnamesrv:
    image: apache/rocketmq:5.2.0
    container_name: ragent-demo-rmqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m"
    command: sh mqnamesrv
    healthcheck:
      test: [ "CMD-SHELL", "grep -q 'The Name Server boot success' /home/rocketmq/logs/rocketmqlogs/namesrv.log || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  rmqbroker:
    image: apache/rocketmq:5.2.0
    container_name: ragent-demo-rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: "rmqnamesrv:9876"
      JAVA_OPT_EXT: "-Xms256m -Xmx384m"
    depends_on:
      rmqnamesrv:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        cat > /home/rocketmq/rocketmq-5.2.0/conf/broker.conf << 'EOF'
        brokerClusterName = DefaultCluster
        brokerName = broker-a
        brokerId = 0
        deleteWhen = 04
        fileReservedTime = 48
        brokerRole = ASYNC_MASTER
        flushDiskType = ASYNC_FLUSH
        brokerIP1 = 127.0.0.1
        timerMaxDelaySec = 31622400
        EOF
        sh mqbroker --enable-proxy -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  ragent-pg-data:
  ragent-rustfs-data: